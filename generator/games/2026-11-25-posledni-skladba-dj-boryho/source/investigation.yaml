```
format_version: 1

narrator:
  name: "kpt. {{char:jan-horak}}"
  role: vedoucí vyšetřování

# Produkční poznámky:
# Kapitoly bez after se zobrazují při otevření příslušné obálky.
# Kapitoly s after se zobrazují po úspěšném splnění daného úkolu.
# Vypravěč ani kolegové nesdělují odpovědi před splněním úkolů.
# Vyhodnocení viny probíhá výhradně prostřednictvím závěrečného obvinění.
# Dokumenty se při kompletaci třídí podle pole stage, nikoli podle čísla.
# D65–D69 proto patří do obálky A.
# D70 obsahuje později doplněnou fotografii a závěrečný pokyn.
# Cílová délka hry je 5–6 hodin; skutečná délka vyžaduje ověření playtestem.

chapters:
  - id: kap-a1
    stage: A
    title: Pondělní ráno
    text: |
      Do služby jsem nastoupil krátce před sedmou. Ještě jsem si
      ani nestihl udělat kávu, když mi kolega oznámil nález těla
      na koupališti v {{place:kunstat}}.

      Takové telefonáty člověk po letech služby pozná. Na začátku
      nikdo neví skoro nic, ale všichni už mají nějakou představu
      o tom, co se asi stalo.

      Když jsem dorazil na místo, pršelo. Bazén byl prázdný,
      občerstvení zavřené a na plotě pořád visela vybledlá cedule
      s letní otevírací dobou. U provozní budovy stála hlídka.
      Uvnitř pracoval technik.

      Mrtvého muže znalo v tomhle regionu překvapivě mnoho lidí.
      Pro někoho byl hospodský, pro někoho obchodní partner,
      pro jiné člověk, který jim hrál na svatbě.

      V průběhu dopoledne jsme začali mluvit s jeho nejbližšími.
      Postupně se ukazovalo, že předchozí večer nebyl zdaleka tak
      obyčejný, jak se zpočátku zdálo.

      Před vámi leží první část spisu. Zatím nemáte výsledky
      pitvy ani většinu technických podkladů.

      Chci, abyste se seznámili se všemi prověřovanými osobami.
      Zapisujte si, co tvrdí, ale také to, na co neodpověděly.

      A pamatujte, že první výpověď je jen začátek vyšetřování.

  - id: kap-a2
    stage: A
    after: P1
    title: Lidé za jmény
    text: |
      Místo nálezu už máme správně přiřazené. Teď potřebuji,
      abychom se od samotné místnosti na chvíli vzdálili
      a podívali se na lidi, kteří se kolem oběti pohybovali.

      Když jsem poprvé četl výpověď jeho manželky, připadala
      mi jako výpověď člověka, kterému se během několika hodin
      rozpadl celý dosavadní život.

      Obchodní společník mluvil hlavně o technice a provozu.
      Zaměstnankyně popisovala ranní nález. Konkurenční DJ se
      vracel k zakázkám. Bratr mluvil o rodině a účetní se
      držela odborných výrazů.

      Každý z nich znal jinou část života stejného člověka.

      Jenže žádná z těch částí zatím netvoří celý obraz.

      Při vyšetřování podobných případů si zakládám jednoduchou
      časovou osu. Nejdřív do ní vkládám jen události, které
      dokážu nějakým způsobem nezávisle potvrdit. Teprve potom
      přidávám výpovědi a neověřené časové odhady.

      Zkuste postupovat stejně.

      V prvních dokumentech najdete několik údajů o tom,
      kdy oběť opustila svůj běžný pracovní režim a začala
      vyřizovat nedělní večerní záležitosti.

      Potřebuji jeden pevný bod, od kterého budeme pokračovat.

      Nepřebírejte automaticky první čas, který najdete.
      Podívejte se, odkud pochází a kdo ho může skutečně potvrdit.

  - id: kap-b1
    stage: B
    title: Každý něco skrývá
    text: |
      V úterý dopoledne jsem dostal první souhrn zdravotnických
      výsledků. Zároveň se nám začaly vracet odpovědi na žádosti
      o provozní dokumentaci.

      Podobné vyšetřování málokdy postupuje rovně. Spíš připomíná
      situaci, kdy člověk otevře několik zásuvek a zjistí, že
      každá obsahuje jiný nedokončený příběh.

      Na jednom stole jsem měl osobní zprávy. Na druhém účetní
      podklady. Kolega přinesl dokumenty k rodinnému dluhu
      a technik mi oznámil, že na jednom zajištěném předmětu
      máme použitelnou stopu.

      Bylo lákavé začít si okamžitě vytvářet vlastní teorii.

      Nedovolil jsem si to.

      Potřebuji totiž vědět, které skutečnosti mají přímý vztah
      ke smrti oběti a které pouze vysvětlují, proč se některé
      osoby chovají při výslechu nepřirozeně.

      Dostáváte zdravotnické výsledky, první telefonní výpisy
      a několik dokumentů, které nebyly při počátečním šetření
      k dispozici.

      Podívejte se také znovu na první výpovědi. Některé věty
      v nich nyní mohou působit jinak.

      Začněte tím, co dokážeme určit odborně, bez ohledu na
      sympatie nebo antipatie k jednotlivým podezřelým.

      Jakmile budeme mít jasno v základních zdravotnických
      závěrech, můžeme se věnovat času a příležitosti.

      Teprve potom začnou mít jednotlivá alibi skutečný význam.

  - id: kap-b2
    stage: B
    after: P3
    title: Co nám neřekli
    text: |
      Zdravotnické výsledky nám dovolují zúžit počet možných
      vyšetřovacích verzí. Pořád ale máme před sebou stejnou
      skupinu lidí a jejich nedělní večer.

      Při konfrontaci s dokumenty se někteří začali vracet ke
      svým původním slovům. Jeden připustil návštěvu, o které
      předtím nemluvil. Jiný nedokázal doložit část večera,
      přestože si byl původně svým alibi naprosto jistý.

      Vím, že takové rozpory mohou působit přesvědčivě.

      Jenže nepravdivá výpověď není automaticky přiznání vraždy.
      Někdy člověk zatajuje vlastní dluh. Někdy nevěru. Někdy
      se jen bojí, že pravdivé vysvětlení bude znít ještě hůř
      než lež, kterou si předem připravil.

      Chci, abyste si u každého člověka vedli dva oddělené
      záznamy. První bude obsahovat možné motivy. Druhý skutečně
      ověřené údaje o jeho pohybu.

      Nezapočítávejte do osobního alibi elektronickou událost,
      pokud nevíte, kdo ji opravdu provedl.

      A nezaměňujte pouhou možnost návštěvy za prokázanou
      přítomnost v konkrétním okamžiku.

      Máme také několik záznamů, které nám pomáhají určit
      časové období důležité pro další vyšetřování.

      Projděte zdravotnickou dokumentaci a zaznamenejte
      předběžné časové mantinely.

      Je možné, že je později ještě upravíme. Teď ale musíme
      pracovat s nejlepším podkladem, který máme k dispozici.

  - id: kap-c1
    stage: C
    title: Hodiny nelžou. Ale mohou ukazovat špatný čas.
    text: |
      Ve středu jsem strávil skoro celé dopoledne s kolegyní
      z digitální kriminalistiky. Na obrazovce jsme měli
      několik kamerových záznamů, provozní výpisy a časové
      údaje, které spolu na první pohled nesouhlasily.

      Člověk má tendenci věřit tomu, co je napsané přímo
      na snímku. Zvlášť když vidí datum, hodiny a minuty
      v rohu obrazu.

      Jenže i přesně vypadající údaj může být nepřesný.

      Současně jsme začali prověřovat dokumentaci, kterou nám
      poskytli organizátoři nedělních hudebních akcí. Ani tam
      nebylo všechno tak jednoduché, jak znělo při prvním
      výslechu.

      Dostal se nám do rukou také inventurní protokol.
      Je to jeden z těch obyčejných provozních formulářů,
      jakých má každá firma plné šanony.

      V tuto chvíli ještě nevíme, které z jeho údajů budou
      pro případ skutečně důležité.

      Proto vás žádám, abyste nevyřazovali žádnou evidenci
      jen proto, že vám její význam zatím uniká.

      V této obálce najdete časové podklady, svědecké výpovědi,
      servisní dokumentaci a výsledky technického prověřování.

      Vaším úkolem je dostat všechny údaje na jednu společnou
      časovou osu.

      Pokud se dva dokumenty rozcházejí, nejdřív zjistěte
      důvod. Teprve potom rozhodujte, který čas je správný.

  - id: kap-c2
    stage: C
    after: P5
    title: Obraz bez kontextu
    text: |
      Právě jste opravili jeden z důležitých časových údajů.
      Stejnou pozornost teď věnujte i ostatním záznamům.

      Když mi kolegové poprvé přinesli snímky z parkoviště,
      bylo velmi snadné přiřadit vozidlo člověku, který ho
      běžně používal.

      Takové přiřazení ale obsahuje předpoklad.

      A předpoklad musím umět oddělit od toho, co skutečně
      vidím na záznamu.

      Totéž platí o telefonu, přístupové kartě, pracovním účtu
      nebo předem připraveném programu kulturní akce. Všechny
      tyto věci vytvářejí záznamy. Ne všechny dokládají osobní
      přítomnost svého majitele.

      Některé výpovědi se nám už podařilo doplnit nezávislými
      podklady. Jiné mají stále významné mezery.

      Všimněte si také, že několik svědků popsalo různé části
      stejného večera. Neshodují se ve všech detailech a jejich
      osobní časové odhady se liší.

      To nemusí znamenat, že všichni úmyslně lžou.

      Když budu po člověku chtít přesný čas obyčejné nedělní
      události, kterou v danou chvíli nepovažoval za důležitou,
      nemohu očekávat dokonalou paměť.

      Proto se znovu podívejte na nezávislé zdroje.

      Další kontrolní otázka se týká rozdílu mezi událostí,
      která byla pouze zaznamenána, a událostí, při které
      dokážeme potvrdit přítomnost konkrétního člověka.

  - id: kap-d1
    stage: D
    title: Cena mlčení
    text: |
      Čtvrtek jsme začali na hospodářském oddělení.

      Kolega měl před sebou vytištěné účetní výstupy, faktury,
      potvrzení a několik tabulek. Na první pohled to celé
      působilo jako velmi nepřehledný obchodní spor.

      Jenže peníze mají jednu užitečnou vlastnost. Pokud je
      jejich pohyb dostatečně zdokumentovaný, dají se jednotlivé
      události od sebe poměrně přesně oddělit.

      V tomto případě jsme od začátku věděli o několika
      různých finančních problémech.

      Někdo dlužil oběti. Oběť dlužila někomu jinému.
      V podnikové evidenci byly soukromé výdaje a současně
      se objevovaly rozdíly v zákaznických platbách.

      Nechtěl jsem, aby se nám všechny tyto skutečnosti
      slily do jednoho neurčitého podezření.

      Proto jsme jednotlivé skupiny začali prověřovat zvlášť.

      Současně jsme dokončovali další konfrontační výslechy
      a získávali podklady k večernímu pohybu osob, u kterých
      dosud chybělo spolehlivé alibi.

      Před vámi je nyní hospodářská část spisu.

      Některé dokumenty jsou delší a obsahují více čísel.
      Doporučuji, abyste si rozdělili práci a následně si
      jednotlivá zjištění navzájem vysvětlili.

      Není potřeba rozumět účetnictví jako profesionál.

      Potřebujete především rozlišit, o jakou platbu jde,
      kdo ji evidoval a ke komu peníze ve skutečnosti směřovaly.

  - id: kap-d2
    stage: D
    after: P7
    title: Za čísly jsou lidé
    text: |
      Výše jednotlivých finančních nesrovnalostí už začíná být
      mnohem přehlednější.

      Z vlastní zkušenosti vím, že velká částka může v člověku
      vyvolat silnější podezření než malá. Při vyšetřování ale
      samotná velikost částky nerozhoduje.

      Potřebuji vědět, komu konkrétně hrozilo odhalení, čeho
      se měl obávat a zda existuje souvislost mezi touto obavou
      a událostmi nedělního večera.

      Máme před sebou několik různých identifikátorů.
      Některé označují provozní subjekt. Jiné konkrétní
      platební profil nebo bankovní cíl.

      Není správné je zaměňovat.

      Zkuste si představit, že zkoumáte zásilku. Jeden údaj
      označuje odesílatele, druhý přepravní službu a třetí
      člověka, kterému nakonec skutečně dorazila.

      Teprve propojením všech potřebných údajů získáte
      úplný obraz její cesty.

      Podobně budeme postupovat i u finančních dokumentů.

      Mezitím si znovu projděte časovou osu. Několik původních
      výpovědí už bylo změněno, další stále čekají na úplné
      prověření.

      Nechci, abyste se při práci s penězi přestali věnovat
      ostatním důkazům.

      Finanční motiv může vysvětlit, proč někdo jednal.
      Nemůže sám o sobě prokázat, že byl na místě činu.

      Potřebujeme obojí. A pokud možno ještě něco, co obě
      části příběhu spojí.

  - id: kap-e1
    stage: E
    title: Poslední obálka
    text: |
      Je pátek odpoledne.

      Od prvního oznámení uplynulo pět dní. Na stole mám
      závěrečné materiálové expertizy, další potvrzení,
      dokončenou časovou analýzu a poslední konfrontační
      výpovědi.

      Když jsme v pondělí začínali, nikdo z nás nevěděl,
      jestli se případ podaří objasnit.

      Postupně jsme objevovali věci, které se smrtí oběti
      souvisely přímo, i věci, které by za jiných okolností
      zůstaly jen soukromým nebo obchodním problémem.

      Některé osoby přišly o naši důvěru, když jsme zjistili,
      že nám neříkaly pravdu. U dalších jsme museli změnit
      původní představu o tom, co jejich výpověď znamenala.

      Teď ale potřebujeme přestat hodnotit jednotlivé
      dokumenty odděleně.

      Vraťte se k prvnímu ohledání. Připomeňte si, jaké
      předměty byly zajištěny. Projděte inventurní evidenci,
      laboratorní výsledky, telefonní údaje a všechny
      pozdější změny výpovědí.

      U každého důkazu si položte otázku, co opravdu
      prokazuje a co už by bylo jen vaším předpokladem.

      Závěrečná obálka obsahuje vše, co jsme dosud postrádali.

      Nedám vám žádné jméno ani hotovou teorii.

      Chci, abyste dokázali sestavit rekonstrukci sami.

      Až ji budete mít, musí dávat smysl nejen vám, ale
      také člověku, který celý případ dosud vůbec neznal.

  - id: kap-e2
    stage: E
    after: P9
    title: Od podezření k důkazu
    text: |
      Nyní máte přesnější časové vymezení fyzického konfliktu.
      Je načase znovu otevřít vlastní poznámky z předchozích
      obálek.

      U některých osob se možná váš názor změní. Alibi,
      které dříve nepokrývalo celé pracovní období,
      může mít po zpřesnění času jinou důkazní hodnotu.

      Stejně tak záznam přístroje, který dříve vypadal jako
      přesvědčivé potvrzení výpovědi, nemusí po získání
      dalších podkladů znamenat totéž.

      Teď už nechci žádné nové domněnky.

      Chci, abyste systematicky prošli všech sedm osob.
      U každé určete motiv, původní tvrzení, změněnou
      výpověď a skutečně ověřenou přítomnost.

      Potom se soustřeďte na fyzické stopy.

      Materiálová expertiza může velmi přesně určit původ
      zkoumaného předmětu. Sama ale nemusí vysvětlit jeho
      cestu na místo nálezu.

      Tu musíte rekonstruovat pomocí dalších dokumentů.

      Zvlášť důležité je rozlišit evidenční označení
      zajištěné stopy od označení celého předmětu a údaje
      o jeho původním držiteli.

      Právě proto jsem vám ponechal všechny materiály
      z předchozích částí případu.

      Než otevřeme závěrečné obvinění, ověřte si, že
      pracujete se správnou stopou a že její význam
      dokážete vysvětlit bez jakéhokoli neprokázaného
      předpokladu.

      To je rozdíl mezi podezřením a důkazním řetězcem.

  - id: kap-e3
    stage: E
    after: P10
    title: Rozhodnutí je na vás
    text: |
      Tímto končí předávání důkazů.

      V průběhu vyšetřování jste dostali sedmdesát dokumentů.
      Některé vám poskytly zásadní zjištění. Jiné pomohly
      vysvětlit okolnosti, které původně vypadaly podezřele.

      Teď už před sebou nemáte neznámého člověka nalezeného
      v prázdném rekreačním areálu.

      Znáte jeho rodinné vztahy, podnikatelské problémy,
      pracovní spory i některá tajemství, která se snažil
      před okolím uchovat.

      Stejně tak znáte mnohem lépe lidi, které jsme
      v souvislosti s jeho smrtí prověřovali.

      Potřebuji od vás čtyři závěrečné odpovědi.

      Než je potvrdíte, doporučuji, aby každý člen týmu
      stručně vysvětlil vlastní pohled na případ. Pokud se
      v něčem neshodnete, vraťte se k příslušným dokumentům.

      Nehlasujte podle toho, kdo vám připadá nejméně
      sympatický nebo kdo během výslechu nejvíce lhal.

      Zkuste si představit, že vaše závěrečná rekonstrukce
      bude zítra předložena někomu, kdo má povinnost
      prověřit každý její jednotlivý krok.

      Dokážete vysvětlit příčinu smrti?

      Dokážete spojit motiv s konkrétním člověkem?

      Dokážete prokázat jeho spojení s fyzickým konfliktem
      a současně vysvětlit, proč za něj neodpovídají ostatní?

      Pokud ano, přejděte k závěrečnému obvinění.

      Tentokrát už nebudeme hledat správné číslo ani čas.

      Tentokrát rozhodujete o celém případu.

voice_messages:
  - id: hz-a1
    stage: A
    sender: "nprap. {{char:petr-hala}}"
    role: kriminalista na místě nálezu
    voice: male
    text: |
      Ahoj, týme. Máte tam první protokol z koupaliště.
      Než se pustíte do výpovědí, projděte si pořádně
      soupis zajištěných věcí. Zatím nevíme, co z toho
      bude podstatné. Hlavně si nepleťte místo nálezu
      s automaticky prokázaným místem vzniku všech stop.

  - id: hz-a2
    stage: A
    sender: "{{char:david-kolar}}"
    role: kriminalistický technik
    voice: male
    text: |
      Zdravím. Jen krátká poznámka k těm předmětům.
      Některé jsou úplně běžné provozní věci, jiné
