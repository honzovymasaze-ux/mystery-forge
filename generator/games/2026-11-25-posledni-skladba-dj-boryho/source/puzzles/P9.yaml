format_version: 1
id: P9
title: Rozpad časové osy
stage: E
mechanic: deduction
difficulty: hard

in_world_reason: |
  Vyšetřovatelé mají k dispozici závěrečnou korelaci
  časových záznamů. Před obviněním musí nahradit
  původní širší interval přesněji vymezeným obdobím
  fyzického konfliktu.

reveals: Definitivní délku rozhodného intervalu.

reveal_text: |
  Osm minut.

  Právě těchto osm minut musí pokrýt skutečné osobní
  alibi každého ze sedmi podezřelých.

  Vraťte se ke všem výpovědím, i k těm, které jste
  považovali za uzavřené.

answer: "8"
accepted: ["08", "osm", "8 minut"]

answer_format:
  kind: number
  label: Počet minut

question: Kolik minut trvá závěrečný interval, do kterého byl nezávislými záznamy vymezen fyzický konflikt?

params: {}

clues:
  - id: p9-puvodni
