    quote: "Čas zobrazovaný kamerou K-02 byl o osm minut napřed oproti skutečnému místnímu času."

  - id: p9-zaver
    document: D60
    quote: "Vzájemná korelace nezávislých záznamů vymezuje rozhodný fyzický konflikt do intervalu 21:24–21:32."

solution:
  - text: Odlište původní předběžný časový interval od závěrečného časového zařazení konfliktu.
    uses: [p9-puvodni, p9-zaver]

  - text: Ověřte, že při práci s kamerou používáte opravené časové údaje.
    uses: [p9-kamera]

  - text: Vypočítejte délku intervalu 21:24–21:32.
    uses: [p9-zaver]

hints:
