format_version: 1
title: DJ Bory – Poslední skladba
tagline: Sedm lidí mělo důvod, aby už nikdy nepromluvil.
premise: 'Nedělní noc. Říjnový déšť. Opuštěné koupaliště po skončení

  letní sezóny.


  V pondělí ráno je v technickém zázemí koupaliště nalezen mrtvý

  místní hospodský, svatební DJ a provozovatel dvou rekreačních

  areálů, známý pod přezdívkou DJ Bory.


  Prvotní podezření na nešťastnou událost vystřídá vyšetřování

  násilného trestného činu. Postupně vycházejí najevo problémy

  v manželství, nevyrovnané dluhy, anonymní výhrůžky, podivné

  účetní operace a tajemství sahající několik let do minulosti.


  Sedm podezřelých. Jedenáct svědků. Desítky dokumentů.

  Někteří lidé lžou, aby ochránili sebe. Jiní, aby ochránili

  někoho dalšího.


  A jeden z nich lže, protože zavraždil člověka.

  '
setting: Kunštát, Rudka, Boskovice a okolí
era: '2026'
tone: temný, realistický, psychologický, maloměstský, pomalu gradující
visual_style: noir
truth: "SKUTEČNÝ PRŮBĚH PŘÍPADU\nPouze pro interní vyhodnocení hry. Nikdy nezobrazovat hráčům\npřed dokončením závěrečného\
  \ obvinění.\n\nPachatelkou je Lenka Šimková, vedoucí koupaliště\nv Kunštátu a osoba, která následujícího rána\
  \ oznámila nález těla.\n\nJejí skutečný motiv není žárlivost ani nešťastná láska,\npřestože s obětí skutečně udržovala\
  \ krátký intimní vztah.\n\nBěhem letní sezóny 2026 vzniklo v systému elektronických\npermanentek celkem 47 neoprávněných\
  \ refundací. Celková\nškoda dosáhla 187600 Kč.\n\nRefundace byly evidovány pod společným provozním účtem\na v\
  \ prvotních účetních podkladech nebylo patrné, která\nfyzická osoba byla jejich skutečným příjemcem.\n\nPeníze\
  \ byly připsány prostřednictvím platební služby\nna zákaznický profil označený R-419.\n\nTento profil patřil Lenka\
  \ Šimková.\n\nJeho skutečnou vlastnici lze určit až porovnáním exportu\nrefundací, evidence platební služby a\
  \ potvrzení banky.\nŽádný z těchto dokumentů samostatně nevysvětluje celý\nfinanční tok.\n\nBořek Vítek nesrovnalosti\
  \ objevil v pátek\n16. října 2026. Zpočátku podezíral obchodního společníka\na externí účetní, protože oba měli\
  \ přístup k provozním datům.\n\nV neděli 18. října zjistil, že peníze směřovaly na soukromý\nzákaznický profil.\
  \ Na pondělí si sjednal mimořádnou účetní\nkontrolu.\n\nV neděli večer se na koupališti postupně vystřídalo několik\n\
  osob. Každá tam měla vlastní důvod být a každá mohla\nzpočátku působit jako možný pachatel.\n\nLenka Šimková tvrdila,\
  \ že celý večer strávila\nv Boskovicích u kamarádky. Ve skutečnosti odešla z jejího\nbytu ve 20:52 a vrátila se\
  \ až po 22. hodině.\n\nTelefon zůstal v bytě kamarádky. Síťové a telefonní záznamy\nproto zdánlivě potvrzovaly\
  \ její alibi.\n\nKamarádka původně lhala, protože nevěděla, co se skutečně\nstalo, a chtěla zakrýt jinou soukromou\
  \ záležitost.\n\nJejí opravená výpověď je zpřístupněna až v obálce E.\n\nVečer se Lenka Šimková dostavila na koupaliště\n\
  kvůli rozhovoru s obětí. Oběť jí oznámila, že další den\npředá účetní dokumentaci k nezávislé kontrole.\n\nNásledoval\
  \ osobní konflikt. Pachatelka oběť úmyslně\nfyzicky napadla. Následkem tupého poranění hlavy oběť zemřela.\n\n\
  Přesný úmyslný fyzický útok není podrobně rekonstruován.\nPro herní řešení je podstatná příčina smrti, časová\
  \ osa,\ntotožnost přítomných osob a důkazní řetězec.\n\nNa oděvu oběti byla nalezena drobná ulomená část nového\n\
  kovového přívěsku se specifickým lomem a částí evidenčního\noznačení.\n\nPřívěsky tohoto typu byly vydávány zaměstnancům\
  \ při\nposezónní inventuře.\n\nZ evidence výdeje vyplývá, že příslušný přívěsek byl\npředán Lenka Šimková v neděli\
  \ v 19:46.\n\nOd té doby až do rozhodného večera se s obětí podle\nnezávislých podkladů nemohla setkat.\n\nUlomená\
  \ část přívěsku je proto významná pro časové\nzařazení jejich fyzického kontaktu.\n\nDoplňující materiálová expertiza\
  \ v obálce E potvrzuje,\nže fragment nalezený na oděvu oběti přesně odpovídá\npoškozenému přívěsku zajištěnému\
  \ mezi osobními věcmi\npachatelky.\n\nIdentifikace samotného přívěsku vyžaduje porovnání\ndokumentů z obálek A,\
  \ C a E. Jeden dokument popisuje\nmísto nálezu fragmentu, druhý evidenci vydaných předmětů\na třetí vzájemnou\
  \ shodu lomových ploch.\n\nK tomuto důkazu se přidává vyvrácené alibi, časová osa\nfyzického kontaktu, motiv a\
  \ další nezávislé důkazy.\n\nPachatelka se v pondělí dostavila do zaměstnání a oznámila\nnález mrtvého muže.\n\
  \nBěhem ranního oznámení uvedla jednu okolnost týkající se\noběti, kterou podle pozdější rekonstrukce nemohla\
  \ znát\npouze z místa nálezu. Tato okolnost je podpůrným důkazem,\nnikoli samostatným usvědčením.\n\nOSTATNÍ PODEZŘELÍ\n\
  \nMonika Vítková:\nManželství bylo před rozpadem. Věděla o nevěře a obávala\nse ztráty rodinného podniku. V neděli\
  \ se s manželem\npohádala. Část večera neměla doloženou. Později se ukáže,\nže navštívila právní poradkyni kvůli\
  \ připravované dohodě\no odloučení. Během rozhodného fyzického konfliktu byla\nprokazatelně přítomna na vzdálené\
  \ provozovně.\n\nRadim Kočí:\nZneužíval podnikové prostředky k úhradě soukromých výdajů.\nNešlo však o neoprávněné\
  \ refundace. Oběť mu hrozila\nukončením obchodní spolupráce. Večer navštívil koupaliště,\nale v době smrtelného\
  \ konfliktu řešil poruchu zařízení\nv Rudce za přítomnosti technika.\n\nTomáš Pešek:\nVedl dlouhodobý profesní\
  \ spor s obětí. Některé výhrůžné\nzprávy jsou autentické. Večer měl přestávku mezi dvěma\nhudebními vystoupeními,\
  \ během které se s obětí skutečně\nsetkal. Následně odjel. Jeho přítomnost na druhém\nvystoupení je ověřena nezávislými\
  \ záznamy.\n\nPavel Vítek:\nMladší bratr oběti. Dlužil bratrovi peníze a hrozilo mu,\nže přijde o dílnu, kterou\
  \ využíval. Večer se na koupališti\npokusil dohodnout odklad splatnosti dluhu. Zatajil cestu\ntaxíkem, protože\
  \ následně navštívil člověka, před nímž\nskrýval svou finanční situaci. V době útoku se nacházel\nv jedoucím vozidle\
  \ mimo areál.\n\nEva Malíková:\nExterní účetní obou koupališť. Kvůli vlastním chybám\npřehlédla neoprávněné refundace\
  \ a obávala se profesních\nnásledků. Oběti poslala zprávu, kterou bylo možné chápat\njako výhrůžku. Večer přivezla\
  \ účetní podklady. Později\nse potvrdí, že její evidenční přístup neznamenal příjem\nodcizených peněz. Rozhodnou\
  \ dobu strávila s druhou osobou\nna účetní konzultaci mimo koupaliště.\n\nViktor Hrubý:\nDodavatel občerstvení,\
  \ který se s obětí soudil o neuhrazenou\nfakturu. Měl přístup do areálu. Jeho vozidlo zachytila\nkamera poblíž\
  \ koupaliště. V rozhodné době však vozidlo\npoužíval zaměstnanec. Samotný dodavatel byl osobně přítomen\nu reklamace\
  \ dodávky ve skladu v Boskovicích.\n\nČTYŘI HLAVNÍ FALEŠNÉ STOPY\n\n1. Výhrůžky konkurenčního DJ.\n   Jsou pravé,\
  \ ale časově neodpovídají spáchání vraždy.\n\n2. Krize manželství a připravované odloučení.\n   Manželka skutečně\
  \ lhala o jejich vztahu. Důkaz její\n   nepřítomnosti v rozhodné době však její vinu vylučuje.\n\n3. Podezřelé\
  \ účetní operace obchodního společníka.\n   Jde o jiné finanční pochybení než neoprávněné refundace.\n   Obě skupiny\
  \ plateb jsou definitivně odděleny v obálce D.\n\n4. Vozidlo dodavatele zachycené kamerou.\n   Vozidlo je identifikováno\
  \ správně, jeho řidič nikoli.\n   Totožnost skutečného řidiče je potvrzena až v obálce E.\n\nDALŠÍ ZAVÁDĚJÍCÍ\
  \ OKOLNOSTI\n\n5. Otisk prstu bratra oběti na hrnku.\n   Vysvětluje jej jeho skutečná dřívější návštěva.\n\n6.\
  \ Přítomnost telefonu pachatelky v Boskovicích.\n   Telefon byl skutečně v Boskovicích. Jeho majitelka ne.\n\n\
  7. Přihlášení prostřednictvím společného provozního účtu.\n   Uživatelské přihlášení samo neidentifikuje člověka,\n\
  \   který skutečně získal neoprávněně vyplacené peníze.\n\n8. Domnělá otrava.\n   Podezření vznikne kvůli lékům\
  \ nalezeným v místnosti.\n   Toxikologie prokáže, že nesouvisejí s příčinou smrti.\n\nZÁVĚREČNÝ DŮKAZNÍ ŘETĚZEC\n\
  \nD2: Nález fragmentu na oděvu oběti.\nD29: Evidence předání nového přívěsku.\nD53: Materiálová shoda fragmentu\
  \ s poškozeným přívěskem.\nD54: Upřesnění časového omezení možného kontaktu.\nD55: Vyvrácení původního osobního\
  \ alibi pachatelky.\nD43, D44, D56: Propojení neoprávněných refundací s příjemcem.\nD60: Potvrzení rozhodného\
  \ časového okna fyzického konfliktu.\nD61 a D62: Úplné vyloučení posledních alternativních verzí.\n\nTeprve souhrn\
  \ těchto dokumentů umožňuje spolehlivě\nrekonstruovat celý případ.\n\nHerní případ je zcela smyšlený. Skutečné\
  \ názvy obcí\nslouží pouze jako geografické zasazení. Všechny osoby,\npodniky, konkrétní areály, instituce, kontaktní\
  \ údaje,\nidentifikátory a popsané události jsou fiktivní.\n"
