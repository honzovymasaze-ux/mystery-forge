format_version: 1
title: DJ Bory – Poslední skladba
tagline: Sedm lidí mělo důvod, aby už nikdy nepromluvil.
premise: |
  Nedělní noc. Říjnový déšť. Opuštěné koupaliště po skončení
  letní sezóny.

  V pondělí ráno je v technickém zázemí koupaliště nalezen mrtvý
  místní hospodský, svatební DJ a provozovatel dvou rekreačních
  areálů, známý pod přezdívkou DJ Bory.

  Prvotní podezření na nešťastnou událost vystřídá vyšetřování
  násilného trestného činu. Postupně vycházejí najevo problémy
  v manželství, nevyrovnané dluhy, anonymní výhrůžky, podivné
  účetní operace a tajemství sahající několik let do minulosti.

  Sedm podezřelých. Jedenáct svědků. Desítky dokumentů.
  Někteří lidé lžou, aby ochránili sebe. Jiní, aby ochránili
  někoho dalšího.

  A jeden z nich lže, protože zavraždil člověka.

setting: Kunštát, Rudka, Boskovice a okolí
era: "2026"
tone: temný, realistický, psychologický, maloměstský, pomalu gradující
visual_style: noir

truth: |
  SKUTEČNÝ PRŮBĚH PŘÍPADU
  Pouze pro interní vyhodnocení hry. Nikdy nezobrazovat hráčům
  před dokončením závěrečného obvinění.

  Pachatelkou je {{char:lenka-simkova}}, vedoucí koupaliště
  v Kunštátu a osoba, která následujícího rána oznámila nález těla.

  Její skutečný motiv není žárlivost ani nešťastná láska,
  přestože s obětí skutečně udržovala krátký intimní vztah.

  Během letní sezóny 2026 vzniklo v systému elektronických
  permanentek celkem 47 neoprávněných refundací. Celková
  škoda dosáhla 187600 Kč.

  Refundace byly evidovány pod společným provozním účtem
  a v prvotních účetních podkladech nebylo patrné, která
  fyzická osoba byla jejich skutečným příjemcem.

  Peníze byly připsány prostřednictvím platební služby
  na zákaznický profil označený R-419.

  Tento profil patřil {{char:lenka-simkova}}.

  Jeho skutečnou vlastnici lze určit až porovnáním exportu
  refundací, evidence platební služby a potvrzení banky.
  Žádný z těchto dokumentů samostatně nevysvětluje celý
  finanční tok.

  {{char:borek-vitek}} nesrovnalosti objevil v pátek
  16. října 2026. Zpočátku podezíral obchodního společníka
  a externí účetní, protože oba měli přístup k provozním datům.

  V neděli 18. října zjistil, že peníze směřovaly na soukromý
  zákaznický profil. Na pondělí si sjednal mimořádnou účetní
  kontrolu.

  V neděli večer se na koupališti postupně vystřídalo několik
  osob. Každá tam měla vlastní důvod být a každá mohla
  zpočátku působit jako možný pachatel.

  {{char:lenka-simkova}} tvrdila, že celý večer strávila
  v Boskovicích u kamarádky. Ve skutečnosti odešla z jejího
  bytu ve 20:52 a vrátila se až po 22. hodině.

  Telefon zůstal v bytě kamarádky. Síťové a telefonní záznamy
  proto zdánlivě potvrzovaly její alibi.

  Kamarádka původně lhala, protože nevěděla, co se skutečně
  stalo, a chtěla zakrýt jinou soukromou záležitost.

  Její opravená výpověď je zpřístupněna až v obálce E.

  Večer se {{char:lenka-simkova}} dostavila na koupaliště
  kvůli rozhovoru s obětí. Oběť jí oznámila, že další den
  předá účetní dokumentaci k nezávislé kontrole.

  Následoval osobní konflikt. Pachatelka oběť úmyslně
  fyzicky napadla. Následkem tupého poranění hlavy oběť zemřela.

  Přesný úmyslný fyzický útok není podrobně rekonstruován.
  Pro herní řešení je podstatná příčina smrti, časová osa,
  totožnost přítomných osob a důkazní řetězec.

  Na oděvu oběti byla nalezena drobná ulomená část nového
  kovového přívěsku se specifickým lomem a částí evidenčního
  označení.

  Přívěsky tohoto typu byly vydávány zaměstnancům při
  posezónní inventuře.

  Z evidence výdeje vyplývá, že příslušný přívěsek byl
  předán {{char:lenka-simkova}} v neděli v 19:46.

  Od té doby až do rozhodného večera se s obětí podle
  nezávislých podkladů nemohla setkat.

  Ulomená část přívěsku je proto významná pro časové
  zařazení jejich fyzického kontaktu.

  Doplňující materiálová expertiza v obálce E potvrzuje,
  že fragment nalezený na oděvu oběti přesně odpovídá
  poškozenému přívěsku zajištěnému mezi osobními věcmi
  pachatelky.

  Identifikace samotného přívěsku vyžaduje porovnání
  dokumentů z obálek A, C a E. Jeden dokument popisuje
  místo nálezu fragmentu, druhý evidenci vydaných předmětů
  a třetí vzájemnou shodu lomových ploch.

  K tomuto důkazu se přidává vyvrácené alibi, časová osa
  fyzického kontaktu, motiv a další nezávislé důkazy.

  Pachatelka se v pondělí dostavila do zaměstnání a oznámila
  nález mrtvého muže.

  Během ranního oznámení uvedla jednu okolnost týkající se
  oběti, kterou podle pozdější rekonstrukce nemohla znát
  pouze z místa nálezu. Tato okolnost je podpůrným důkazem,
  nikoli samostatným usvědčením.

  OSTATNÍ PODEZŘELÍ

  {{char:monika-vitkova}}:
  Manželství bylo před rozpadem. Věděla o nevěře a obávala
  se ztráty rodinného podniku. V neděli se s manželem
  pohádala. Část večera neměla doloženou. Později se ukáže,
  že navštívila právní poradkyni kvůli připravované dohodě
  o odloučení. Během rozhodného fyzického konfliktu byla
  prokazatelně přítomna na vzdálené provozovně.

  {{char:radim-koci}}:
  Zneužíval podnikové prostředky k úhradě soukromých výdajů.
  Nešlo však o neoprávněné refundace. Oběť mu hrozila
  ukončením obchodní spolupráce. Večer navštívil koupaliště,
  ale v době smrtelného konfliktu řešil poruchu zařízení
  v Rudce za přítomnosti technika.

  {{char:tomas-pesek}}:
  Vedl dlouhodobý profesní spor s obětí. Některé výhrůžné
  zprávy jsou autentické. Večer měl přestávku mezi dvěma
  hudebními vystoupeními, během které se s obětí skutečně
  setkal. Následně odjel. Jeho přítomnost na druhém
  vystoupení je ověřena nezávislými záznamy.

  {{char:pavel-vitek}}:
  Mladší bratr oběti. Dlužil bratrovi peníze a hrozilo mu,
  že přijde o dílnu, kterou využíval. Večer se na koupališti
  pokusil dohodnout odklad splatnosti dluhu. Zatajil cestu
  taxíkem, protože následně navštívil člověka, před nímž
  skrýval svou finanční situaci. V době útoku se nacházel
  v jedoucím vozidle mimo areál.

  {{char:eva-malikova}}:
  Externí účetní obou koupališť. Kvůli vlastním chybám
  přehlédla neoprávněné refundace a obávala se profesních
  následků. Oběti poslala zprávu, kterou bylo možné chápat
  jako výhrůžku. Večer přivezla účetní podklady. Později
  se potvrdí, že její evidenční přístup neznamenal příjem
  odcizených peněz. Rozhodnou dobu strávila s druhou osobou
  na účetní konzultaci mimo koupaliště.

  {{char:viktor-hruby}}:
  Dodavatel občerstvení, který se s obětí soudil o neuhrazenou
  fakturu. Měl přístup do areálu. Jeho vozidlo zachytila
  kamera poblíž koupaliště. V rozhodné době však vozidlo
  používal zaměstnanec. Samotný dodavatel byl osobně přítomen
  u reklamace dodávky ve skladu v Boskovicích.

  ČTYŘI HLAVNÍ FALEŠNÉ STOPY

  1. Výhrůžky konkurenčního DJ.
     Jsou pravé, ale časově neodpovídají spáchání vraždy.

  2. Krize manželství a připravované odloučení.
     Manželka skutečně lhala o jejich vztahu. Důkaz její
     nepřítomnosti v rozhodné době však její vinu vylučuje.

  3. Podezřelé účetní operace obchodního společníka.
     Jde o jiné finanční pochybení než neoprávněné refundace.
     Obě skupiny plateb jsou definitivně odděleny v obálce D.

  4. Vozidlo dodavatele zachycené kamerou.
     Vozidlo je identifikováno správně, jeho řidič nikoli.
     Totožnost skutečného řidiče je potvrzena až v obálce E.

  DALŠÍ ZAVÁDĚJÍCÍ OKOLNOSTI

  5. Otisk prstu bratra oběti na hrnku.
     Vysvětluje jej jeho skutečná dřívější návštěva.

  6. Přítomnost telefonu pachatelky v Boskovicích.
     Telefon byl skutečně v Boskovicích. Jeho majitelka ne.

  7. Přihlášení prostřednictvím společného provozního účtu.
     Uživatelské přihlášení samo neidentifikuje člověka,
     který skutečně získal neoprávněně vyplacené peníze.

  8. Domnělá otrava.
     Podezření vznikne kvůli lékům nalezeným v místnosti.
     Toxikologie prokáže, že nesouvisejí s příčinou smrti.

  ZÁVĚREČNÝ DŮKAZNÍ ŘETĚZEC

  D2: Nález fragmentu na oděvu oběti.
  D29: Evidence předání nového přívěsku.
  D53: Materiálová shoda fragmentu s poškozeným přívěskem.
  D54: Upřesnění časového omezení možného kontaktu.
  D55: Vyvrácení původního osobního alibi pachatelky.
  D43, D44, D56: Propojení neoprávněných refundací s příjemcem.
  D60: Potvrzení rozhodného časového okna fyzického konfliktu.
  D61 a D62: Úplné vyloučení posledních alternativních verzí.

  Teprve souhrn těchto dokumentů umožňuje spolehlivě
  rekonstruovat celý případ.

  Herní případ je zcela smyšlený. Skutečné názvy obcí
  slouží pouze jako geografické zasazení. Všechny osoby,
  podniky, konkrétní areály, instituce, kontaktní údaje,
  identifikátory a popsané události jsou fiktivní.

characters:
  - id: borek-vitek
    name: Bořek Vítek
    role: oběť, hospodský, svatební DJ Bory a provozovatel dvou koupališť
    age: 47
    is_victim: true
    is_suspect: false
    description: |
      Výrazná osobnost místního společenského života.
      Na svatbách dokázal bavit stovky lidí, v soukromí
      však býval tvrdohlavý a obtížně přístupný kritice.
      Vlastnil hospodu a podílel se na provozu dvou
      sezónních koupališť. Zná velké množství místních
      obyvatel a téměř s každým má nějakou minulost.
    secret: |
      Udržoval mimomanželský vztah, připravoval odloučení
      od manželky a objevil rozsáhlé finanční nesrovnalosti.

  - id: monika-vitkova
    name: Monika Vítková
    role: manželka oběti, vedoucí kuchyně hospody
    age: 44
    is_suspect: true
    is_culprit: false
    description: |
      Praktická a pracovitá žena. Hospodu považuje za
      výsledek dvaceti let vlastní práce. Navenek působí
      klidně, v osobních otázkách je uzavřená.
    secret: |
      Připravovala se na rozchod. V neděli večer opustila
      hospodu kvůli soukromé právní konzultaci a při prvním
      výslechu zatajila část svého pohybu.
    motive: Obava ze ztráty manžela, rodinného podniku a majetkového zázemí.
    opportunity: |
      Znala provozní prostory koupaliště a v části večera
      nebyl její pohyb nezávisle ověřen.

  - id: radim-koci
    name: Radim Kočí
    role: obchodní společník, provozovatel lesního koupaliště v Rudce
    age: 41
    is_suspect: true
    is_culprit: false
    description: |
      Technicky zdatný muž, který se stará především
      o údržbu a provozní vybavení obou areálů.
      V rozhovorech působí sebevědomě, ale při zmínkách
      o účetnictví rychle mění téma.
    secret: |
      Z podnikového účtu uhradil soukromé výdaje v hodnotě
      96000 Kč. Oběť to zjistila a požadovala nápravu.
    motive: Hrozící ukončení obchodní spolupráce a finanční odpovědnost.
    opportunity: |
      Měl provozní oprávnění, znal místo činu a v neděli
      večer koupaliště skutečně navštívil.

  - id: lenka-simkova
    name: Lenka Šimková
    role: plavčice, vedoucí koupaliště v Kunštátu, oznamovatelka nálezu
    age: 28
    is_suspect: true
    is_culprit: true
    description: |
      Schopná a organizačně zdatná zaměstnankyně.
      Má na starosti směny, zákaznické reklamace,
      permanentky a běžnou administrativu koupaliště.
      Zpočátku ochotně spolupracuje s vyšetřovateli.
    secret: |
      Získala 187600 Kč prostřednictvím neoprávněných
      refundací. Udržovala krátký vztah s obětí.
      Její tvrzení o celovečerním pobytu v Boskovicích
      je nepravdivé.
    motive: Zabránění odhalení finančního podvodu a ztrátě zaměstnání.
    opportunity: |
      Měla oprávnění k pohybu v areálu a její večerní
      osobní alibi nebylo ve skutečnosti úplné.

  - id: tomas-pesek
    name: Tomáš Pešek
    role: DJ Tommy, konkurenční svatební DJ z Boskovic
    age: 34
    is_suspect: true
    is_culprit: false
    description: |
      Ambiciózní hudebník a příležitostný pořadatel akcí.
      Profesní úspěch je pro něj osobní záležitostí.
      V minulosti se s obětí několikrát veřejně pohádal.
    secret: |
      Pod falešným jménem publikoval negativní recenze
      oběti a poškodil její pověst u několika klientů.
      V neděli se s obětí skutečně setkal, ačkoli to
      při prvním výslechu popřel.
    motive: Ztráta svatebních zakázek a poškození vlastní pověsti.
    opportunity: |
      Mezi dvěma vystoupeními měl dostatek času dostavit
      se do Kunštátu.

  - id: pavel-vitek
    name: Pavel Vítek
    role: mladší bratr oběti, automechanik
    age: 42
    is_suspect: true
    is_culprit: false
    description: |
      Muž se štíhlejší postavou, krátkými tmavě hnědými
      vlasy a ustupující vlasovou linií. Má několikadenní
      strniště a unavený výraz. Obléká se jednoduše,
      většinou do pracovního oblečení.
      Živí se drobnými opravami automobilů.
    secret: |
      Dluží bratrovi 320000 Kč. Další peníze si půjčil
      bez vědomí své partnerky. Večer chtěl zabránit
      vymáhání dluhu.
    motive: Hrozící ztráta dílny a odhalení osobních dluhů.
    opportunity: |
      Měl s bratrem domluvenou večerní schůzku
      a provozní prostory dobře znal.

  - id: eva-malikova
    name: Eva Malíková
    role: externí účetní obou koupališť
    age: 39
    is_suspect: true
    is_culprit: false
    description: |
      Žena střední postavy s rovnými kaštanovými vlasy
      po ramena a tenkými obdélníkovými brýlemi.
      Působí profesionálně a pečlivě. Pod tlakem má
      sklon odpovídat stroze a příliš technicky.
    secret: |
      Přehlédla závažné účetní nesrovnalosti. Některé
      výstupy dodatečně opravovala bez dostatečné
      dokumentace, aby zakryla vlastní profesní chybu.
    motive: Obava ze ztráty klientů, profesní pověsti a náhrady škody.
    opportunity: |
      Večer osobně přivezla účetní dokumentaci
      na koupaliště a měla sjednanou konzultaci s obětí.

  - id: viktor-hruby
    name: Viktor Hrubý
    role: dodavatel občerstvení a nápojů
    age: 51
    is_suspect: true
    is_culprit: false
    description: |
      Robustní muž s krátkými prošedivělými vlasy,
      širokým obličejem a výrazným obočím.
      Nosí tmavé košile, pracovní vesty a jednoduché
      kovové hodinky. V obchodních jednáních bývá
      neústupný.
    secret: |
      Kvůli neuhrazené faktuře vystavil několik
      neoprávněných smluvních pokut. Oběti vyhrožoval
      ukončením dodávek a zveřejněním jejího dluhu.
    motive: Neuhrazené pohledávky a hrozící ztráta významného odběratele.
    opportunity: |
      Znal areál z pravidelných dodávek a jeho vozidlo
      bylo v neděli večer zachyceno poblíž koupaliště.

  - id: marketa-novotna
    name: Markéta Novotná
    role: servírka v hospodě
    age: 24
    description: Pozorná zaměstnankyně, zná atmosféru mezi manželi.
    secret: |
      Občas si bez vědomí vedení zapisovala část spropitného
      jinak, než odpovídalo pravidlům provozu. Proto při
      prvním rozhovoru nechtěla poskytnout všechny účtenky.

  - id: roman-krejci
    name: Roman Krejčí
    role: rybář a pravidelný návštěvník okolí koupaliště
