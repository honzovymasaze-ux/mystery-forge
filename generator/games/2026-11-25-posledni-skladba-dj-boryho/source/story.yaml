epilogues:
  - id: dokonale
    min_score_percent: 100
    title: Poslední skladba dohrála
    text: |
      Když jsem poprvé otevřela tento spis, měla jsem
      před sebou mrtvého člověka a sedm lidí, kteří mi
      každý něco zatajovali.

      Vy jste dokázali rozlišit jejich tajemství od vraždy.

      Nezastavili jste se u prvního podezřelého.
      Nezaměnili jste automobil za řidiče ani telefon
      za člověka. A všimli jste si předmětu, který mohl
      na první pohled působit naprosto bezvýznamně.

      Vyšetřování končí předáním úplného spisu.

      Hospoda po několika týdnech znovu otevře.
      Nad výčepem zůstane stará fotografie z jedné svatby.

      Na jaře se snad znovu napustí bazény.

      Jen člověk, jehož hlas si pamatuje půl městečka,
      už nikdy žádnou další skladbu nepustí.

      Dobrá práce, týme.

  - id: vyreseno
    min_score_percent: 80
    title: Případ uzavřen
    text: |
      Určili jste pachatele a podstatnou část skutečného
      průběhu událostí.

      Některé závěry ještě vyžadují upřesnění, ale hlavní
      důkazní řetězec obstál.

      Spis předávám k dalšímu trestnímu řízení.

      Vraťte se nyní k úplné rekonstrukci a zjistěte,
      které souvislosti vám při vyšetřování unikly.

  - id: castecne
    min_score_percent: 40
    title: Spis se vrací
    text: |
      Část případu jste rozpletli správně.

      Předložené závěry však neodpovídají všem dostupným
      důkazům. Některá ověřená alibi jste nedocenili,
      případně jste spojili nesouvisející motivy.

      Státní zástupce požaduje doplnění vyšetřování.

      Projdeme společně úplnou rekonstrukci případu.

  - id: nevyreseno
    min_score_percent: 0
    title: Pravda zůstala mezi řádky
    text: |
      Předložená rekonstrukce neobstála.

      Našli jste lži, konflikty a finanční nesrovnalosti,
      ale nedokázali jste je správně spojit s násilným
      úmrtím oběti.

      Případ přebírá jiný vyšetřovací tým.

      Všechny podstatné důkazy jste přitom měli
      před sebou.

