    secret: |
      Původně zatajila vlastní návštěvu a odchod kamarádky
      z bytu. V závěrečné výpovědi tuto okolnost napraví.
      Nevěděla, že její lež poskytuje alibi vražedkyni.

  - id: stanislav-prochazka
    name: Stanislav Procházka
    role: servisní technik
    age: 46
    description: Externí odborník na provozní zařízení koupališť.
    secret: |
