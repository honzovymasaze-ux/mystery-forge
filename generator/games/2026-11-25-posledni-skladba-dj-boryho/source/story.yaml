intro: |
  Je pondělí 19. října 2026.

  V okolí {{place:kunstat}} prší už druhý den. Koupaliště
  jsou zavřená, turisté odjeli a v hospodách se pomalu
  začíná topit.

  V 06:47 přijímá operační služba oznámení od vedoucí
  místního koupaliště. V technické místnosti našla muže,
  který nereaguje.

  Jmenuje se {{char:borek-vitek}}. Většina lidí ho zná
  jako DJ Boryho.

  Hrál na svatbách, provozoval hospodu a staral se
  o dvě koupaliště. Byl člověkem, kterého jste mohli
  potkat skoro kdekoliv. A kterého téměř každý nějak
  znal.

  První telefonáty naznačují nehodu. První výpovědi
  ale obsahují rozpory.

  Během několika hodin se objeví sedm lidí, kteří měli
  s mrtvým nevyřešené záležitosti.

  Rozdělím vám práci do pěti částí. Každá další obálka
  bude obsahovat nové důkazy, které mohou změnit význam
  těch předchozích.

  Nikdy nepovažujte případ za vyřešený jen proto,
  že jste našli člověka, který měl důvod lhát.

  Jmenuji se {{char:jan-horak}}. Od této chvíle
  jste součástí mého vyšetřovacího týmu.

  Otevřete obálku A.

