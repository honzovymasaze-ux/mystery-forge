format_version: 1
title: Poslední song DJ Boryho
tagline: Hrál celou noc pro svatebčany. Ráno ho našli v bazénu jeho vlastního koupaliště.
premise: >-
  V neděli 23. srpna 2026 ráno našla plavčice v bazénu koupaliště Pod Hradem v Kunštátě mrtvého Bořka Vítka,
  hospodského, svatebního DJ a provozovatele dvou koupališť. Noc předtím hrál na svatbě. Vypadá to na opilce,
  který spadl do vody. Soudní lékařka si tím ale jistá není.
setting: Kunštát a Rudka na Boskovicku, hospoda, dvě koupaliště a svatební statek
era: '2026'
tone: dramatický, realistický
truth: >-
  Radim Kočí provozoval s Bořkem Vítkem lesní koupaliště v Rudce. Od jara si nechával proplácet faktury za chlor od
  firmy svého bratra Tomáše Kočího, ale do Rudky přišla jen jedna dodávka ze tří. Bořek na podvod přišel, když
  porovnal faktury s provozním deníkem, a na pondělí 24. srpna domluvil schůzku s účetní. Radim si v sobotu 22. srpna
  v 19:40 vzal na pokladně v Rudce služební mobil. Ve 23:52 z něj Bořkovi napsal, ať po svatbě přijede sám na
  koupaliště v Kunštátě. Svůj vlastní telefon nechal doma, aby to vypadalo, že spal. Do láhve slivovice, kterou
  Bořkovi předtím daroval „na usmířenou“, přimíchal prášky na spaní somnaxin, předepsané své ženě Ivetě. Bořek odjel
  ze svatby v 01:10 a v kanceláři koupaliště se s Radimem setkal kolem půl druhé. Napil se slivovice. Ve 02:12 už
  omámený zkusil zavolat manželce Monice, ale ta na svatbě tančila a telefon neslyšela. Radim ho pak udeřil tyčí na
  sběr listí, a když upadl, svezl ho do bazénu, kde se utopil. Ve 02:43 projel Radim autem kolem kamery čerpací
  stanice na výjezdu z Kunštátu a ve 03:05 byl služební mobil zpátky v Rudce. Monika zůstala na svatbě do půl třetí,
  Lenka Šimková spala doma v Rudce a Tomáš Pešek hrál do tří v klubu v Boskovicích.
visual_style: noir
