intro: >-
  Neděle 23. srpna 2026, devět hodin ráno. Jste vyšetřovací tým krajského ředitelství a právě jste dostali na stůl
  spis z Kunštátu. V bazénu koupaliště Pod Hradem našli mrtvého Bořka Vítka, kterému celý kraj říkal DJ Bory.
  Ještě v noci hrál na svatbě a ráno ho plavčice našla ve vodě. Místní policie by případ nejradši uzavřela jako
  nešťastnou náhodu opilého muže. Vedoucí vyšetřování kapitánka Horáková tomu nevěří. Projděte všechny dokumenty,
  porovnávejte časy, výpovědi a výpisy. Zjistěte, kdo Bořka zabil, jak to udělal a proč. Než bude spis uzavřen,
  musíte mít jasno.
deduction:
  culprit: radim-koci
  questions:
    - id: kdo
      prompt: Kdo zabil Bořka Vítka?
      options:
        - { id: monika, text: 'Monika Vítková, manželka' }
        - { id: radim, text: 'Radim Kočí, společník' }
        - { id: lenka, text: 'Lenka Šimková, plavčice' }
        - { id: tomas, text: 'Tomáš Pešek, DJ Tommy' }
      correct: radim
      points: 45
      proven_by: [kniha-vydeje, bunky-sluzebni, auto-radima, sms-z-pokladny]
    - id: jak
      prompt: Jak vrah Bořka omámil?
      options:
        - { id: slivovice, text: 'Prášky ve slivovici, kterou Bořek dostal darem' }
        - { id: koktejl, text: 'Prášky v drinku na svatbě' }
        - { id: injekce, text: 'Injekcí' }
      correct: slivovice
      points: 15
      proven_by: [jed-ve-slivovici, radim-flaska, stopa-e3]
    - id: proc
      prompt: Proč musel Bořek zemřít?
      options:
        - { id: zprone, text: 'Přišel na podvod s fakturami za chlor v Rudce' }
        - { id: pomer, text: 'Kvůli poměru s plavčicí' }
        - { id: svatby, text: 'Přebíral konkurenci svatby' }
        - { id: pojistka, text: 'Kvůli životní pojistce' }
      correct: zprone
      points: 25
      proven_by: [zpronevera, bory-poznamka, obalka-v-trezoru]
    - id: prasky
      prompt: Odkud pocházely prášky somnaxin, kterými byl Bořek omámen?
      options:
        - { id: monika, text: 'Z předpisu Moniky Vítkové' }
        - { id: iveta, text: 'Z předpisu Ivety Kočové' }
        - { id: lekarna, text: 'Koupené bez předpisu' }
      correct: iveta
      points: 15
      proven_by: [iveta-recept, chybi-tablety, jed-ve-slivovici]
  exclusions:
    - suspect: monika-vitkova
      clues: [monika-do-konce, hovor-0212]
      explanation: >-
        Ve 02:12 Bořek z koupaliště volal Monice a ta to nebrala. Fotky z fotoaparátu svatebního fotografa ji ale
        ukazují na statku, devět kilometrů daleko, ještě ve 02:31. Na koupališti v době činu být nemohla.
    - suspect: lenka-simkova
      clues: [lenka-bunky, kniha-vydeje]
      explanation: >-
        Lenčin telefon byl celou noc v Rudce a služební mobil, ze kterého přišla SMS, si v sobotu večer nevzala ona,
        ale R. K.
    - suspect: tomas-pesek
      clues: [tommy-uctenka]
      explanation: Tomáš ve 02:20 sám namarkoval útratu na baru klubu Sklep v Boskovicích, víc než dvacet kilometrů od Kunštátu.
epilogues:
  - id: vyreseno
    min_score_percent: 75
    title: Případ uzavřen
    text: >-
      Radim Kočí se při konfrontaci s kamerovým záznamem a výpisem ze služebního mobilu zhroutil. Účetní Dana Krejčí
      dohledala všechny fiktivní faktury. Monika Vítková hospodu Na Hrázi nezavřela: v září na Bořkovu počest uspořádala
      dětský den, jaký by si přál. Hrálo se jeho playlistem.
  - id: napul
    min_score_percent: 40
    title: Napůl
    text: >-
      Správné jméno jste měli, ale obžaloba se rozpadá na detailech. Obhájce zpochybní motiv i původ prášků a
      vyšetřování se táhne ještě půl roku. Na koupaliště v Kunštátě se letos už nikdo nevrátí.
  - id: nevyreseno
    min_score_percent: 0
    title: Nehoda
    text: >-
      Spis se uzavírá jako nešťastná náhoda opilého muže. Vrah dál chodí do hospody Na Hrázi na pivo a při každé
      svatbě v kraji si někdo vzpomene na DJ Boryho a na to, že tahle smrt nikdy nedávala smysl.
reveal:
  - text: SMS se schůzkou přišla ze služebního mobilu koupaliště v Rudce, který si v sobotu večer vzal R. K.
    clues: [sms-2352, sms-z-pokladny, kniha-vydeje]
  - text: >-
      Služební mobil byl mezi 01:22 a 02:41 v buňce u koupaliště v Kunštátě, zatímco Radimův vlastní telefon ležel
      doma. Ve 02:43 kamera zachytila Radimovu Octavii.
    clues: [bunky-sluzebni, radim-alibi, auto-radima]
  - text: Somnaxin byl ve slivovici, kterou Radim Bořkovi daroval. Na prášky měla předpis jeho žena Iveta.
    clues: [jed-ve-slivovici, radim-flaska, iveta-recept]
  - text: Bořek přišel na to, že dvě dodávky chloru do Rudky nikdy nepřišly, a na pondělí si objednal účetní.
    clues: [bory-poznamka, zpronevera]
  - text: Monika byla v době činu na svatbě, Lenka doma v Rudce a Tomáš v klubu v Boskovicích.
    clues: [monika-do-konce, lenka-bunky, tommy-uctenka]
