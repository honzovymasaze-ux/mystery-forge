  stage: A
  title: Spis KRPB-2318/TČ-2026
  purpose: Úvod a zadání.
- id: D2
  kind: police-report
  stage: A
  title: Úřední záznam o nálezu těla
  purpose: Popis nálezu a místa.
- id: D3
  kind: transcript
  stage: A
  title: Výslech Lenky Šimkové
  purpose: Nálezkyně těla, její verze noci.
