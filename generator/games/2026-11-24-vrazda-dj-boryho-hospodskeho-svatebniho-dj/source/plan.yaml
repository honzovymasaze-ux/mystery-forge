- id: D20
  kind: transcript
  stage: C
  title: Výslech Radima Kočího
  purpose: Jeho alibi.
  must_contain:
  - 'KOČÍ: Byl jsem doma od jedenácti, spal jsem. Telefon jsem měl na nočním stolku, můžete se podívat.'
- id: D21
  kind: phone-records
  stage: C
  title: Výpis služebního mobilu 734 552 019
  purpose: Kde byl služební mobil.
  must_contain:
  - 01:22 – 02:41  data / bez hovorů  KUNŠTÁT-JIH
- id: D25
  kind: note
  stage: D
  title: Bořkova poznámka na šanonu
  purpose: Bořkovo podezření.
  must_contain:
  - Rudka – chlor. Faktury od bratra R. sedí na korunu, jenže kolik toho opravdu přivezli? Projít deník!
- id: D26
