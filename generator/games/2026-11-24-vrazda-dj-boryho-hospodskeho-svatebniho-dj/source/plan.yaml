format_version: 1
motif: 'Hudba a noc: Bořkův playlist, časy písniček a výpisů hovorů. Každý důkaz je otisk času, jako stopy na mixážním pultu. Závěr se uzavírá tím, co Bořek sám vyčetl z čísel v deníku.'
puzzles:
- id: P1
  stage: A
  title: Číslo bez jména
  mechanic: observation
  difficulty: easy
  answer: pokladna
  in_world_reason: Neznámé číslo ve výpisu Bořkova telefonu nemá v jeho kontaktech jméno.
  hidden_from: policie, která číslo zatím neprověřila
  reveals: SMS ve 23:52 přišla ze služebního mobilu pokladny lesního koupaliště v Rudce.
  documents:
  - D8
  - D14
  relies_on:
  - D4
  must_contain:
  - Odkud přesně v Rudce přišla ta zpráva ve 23:52? Napište mi jedno slovo, které u čísla stojí.
  notes: Hráči musí najít číslo ve výpisu a stejné číslo na ceníku koupaliště v Rudce.
- id: P2
  stage: B
  title: Co vypil
  mechanic: recontextualized-document
  difficulty: hard
  depends_on:
  - P1
  answer: slivovice
  in_world_reason: Laboratoř označuje vzorky jen čísly, popis předmětů je v soupisu stop.
  hidden_from: veřejnost a novináři
  reveals: Somnaxin byl ve slivovici z láhve, kterou Bořek dostal darem do kanceláře.
  documents:
  - D15
  relies_on:
  - D11
  - D13
  must_contain:
  - V čem měl Bořek ty prášky? Jedno slovo, žádné značky.
  notes: Laboratoř uvádí pozitivní vzorek jen číslem, soupis stop z obálky A říká, co to je.
- id: P3
  stage: B
  title: Do posledního tance
  mechanic: deduction
  difficulty: medium
  depends_on:
  - P1
  answer: '0231'
  in_world_reason: Fotograf posílá jen seznam souborů s časy, fotky samotné jsou u nevěsty.
  hidden_from: Monika, která tvrdí, že si nepamatuje, kdy odešla
  reveals: Monika byla na statku Na Výsluní ještě ve 02:31.
  documents:
  - D18
  relies_on:
  - D6
  must_contain:
  - Do kolika hodin Monika na svatbě opravdu byla? Napište čas poslední fotky, na které je, čtyřmi číslicemi.
  notes: Popisky fotek jmenují lidi jen tak, jak je zná fotograf. Moniku poznají podle popisu ze svědecké výpovědi.
- id: P4
  stage: C
  title: Auto u benzinky
  mechanic: observation
  difficulty: medium
  depends_on:
  - P2
  answer: 2BE4185
  in_world_reason: Kamera zachytila jen část značky, celou SPZ zná jen evidence parkovacích karet.
  hidden_from: majitel auta, který doufá, že ho kamera nepoznala
  reveals: Auto, které ve 02:43 zachytila kamera čerpací stanice, je Radimova Octavia s SPZ 2BE 4185.
  documents:
  - D22
  - D23
  relies_on:
  - D21
  must_contain:
  - Jaká je celá SPZ toho auta? Napište ji bez mezer.
  notes: Z kamery je vidět typ auta, střešní box a začátek a konec značky. Seznam parkovacích karet doplní zbytek.
- id: P5
  stage: D
  title: Chlor, který nepřišel
  mechanic: anachronism-hunt
  difficulty: hard
  depends_on:
  - P4
  answer: '48600'
  in_world_reason: Podvod je vidět jen tehdy, když vedle sebe položíte faktury a provozní deník.
  hidden_from: účetní, která vidí jen faktury
  reveals: Bořek zaplatil 48 600 Kč za dvě dodávky chloru do Rudky, které nikdy nepřišly.
  documents:
  - D24
  - D27
  relies_on:
  - D25
  must_contain:
  - Kolik korun celkem zaplatil Bořek za chlor, který do Rudky nikdy nedorazil? Napište jen číslo bez mezer.
  notes: Tři faktury, ale v provozním deníku jen jedna dodávka.
- id: P6
  stage: A
  title: Kód od trezoru
  mechanic: arithmetic-lock
  difficulty: medium
  answer: '4032'
  in_world_reason: Bořek nechával kód od trezoru v kanceláři jako počty z věcí, které zná jen personál.
  hidden_from: brigádníci a návštěvníci, kteří chodí kolem nástěnky v kanceláři
  reveals: V trezoru v kanceláři ležela obálka s kopiemi faktur z Rudky a s poznámkou o pondělní schůzce s účetní.
  documents:
  - D29
  relies_on:
  - D1
  - D2
  - D3
  must_contain:
  - Jaký je kód od trezoru? Čtyři číslice.
  notes: Každé slovo vzorce odkazuje na fakt z jiného dokumentu obálky A.
- id: P7
  stage: D
  title: Chybějící tablety
  mechanic: arithmetic-lock
  difficulty: medium
  answer: '40'
  in_world_reason: Lékárna i domovní prohlídka uvádějí jen počty, rozdíl musí spočítat vyšetřovatel.
  hidden_from: majitelé léků, kteří tvrdí, že jim nic nechybí
  reveals: Z balení somnaxinu Ivety Kočové chybějí čtyři tablety, které nikdo neužil, tedy přesně dávka z Bořkovy krve.
  documents:
  - D35
  relies_on:
  - D26
  - D13
  must_contain:
  - Kolik miligramů somnaxinu z Ivetina balení chybí? Dvě číslice.
  notes: Rozdíl vydaných, nalezených a užitých tablet.
