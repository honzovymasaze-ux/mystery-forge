  kind: phone-records
  stage: A
  title: Výpis telefonu Bořka Vítka
  purpose: Časy hovorů a zpráv té noci.
  must_contain:
  - 23:52  SMS příchozí  734 552 019
  - 02:12  hovor odchozí  603 418 227 (Monika)
- id: D5
  kind: chat-log
  stage: A
  title: Zprávy Bořek – Radim
  purpose: Dar slivovice.
  must_contain:
  - 'Radim: Nechal jsem ti v kanclu na koupáku flašku domácí švestkové. Na usmířenou, ať se zase můžeme normálně bavit.'
- id: D6
  kind: transcript
  stage: A
  title: Výpověď svědka ze svatby
  purpose: Hádka Moniky a Bořka, popis Moniky.
  must_contain:
  - Kolem půl jedenácté se Bory s Monikou u baru hrozně pohádali, ona na něj křičela, že ho zabije.
- id: D7
  kind: receipt
  stage: A
  title: Účtenka z lékárny v Monice kabelce
  purpose: Falešná stopa, Monika má somnaxin.
  must_contain:
  - 'Somnaxin 10 mg, 30 tbl. – na předpis – pacient: Vítková Monika'
- id: D9
  kind: chat-log
  stage: A
  title: Zprávy Bořek – Lenka
  purpose: Poměr a výhrůžka.
  must_contain:
  - 'Lenka: Jestli to Monice do konce prázdnin neřekneš ty, řeknu jí to já.'
- id: D10
  kind: chat-log
  stage: A
  title: Zprávy Bořek – Tommy
  purpose: Konkurent.
  must_contain:
  - 'Tommy: Tohle ti nedaruju, Bory. Třetí svatba, co mi přebereš.'
- id: D11
  kind: police-report
  stage: A
  title: Soupis zajištěných stop
