  purpose: Lenka doma, Radimův telefon doma.
  must_contain:
  - Mobilní telefon Lenky Šimkové byl od 21:30 do 07:05 přihlášen výhradně v buňce RUDKA-OBEC.
- id: D17
  kind: receipt
  stage: B
  title: Účtenka z klubu Sklep
  purpose: Alibi Tommyho.
  must_contain:
